name: sub2api-kin-s44-validation
services:
  app:
    image: sub2api-kin-validation:s44-35962a8
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:10444:8080"]
    networks: [default, ingress]
    volumes: ["app-data:/app/data"]
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: s44
      DATABASE_DBNAME: s44_validation
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "10"
      DATABASE_MAX_IDLE_CONNS: "2"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "16"
      REDIS_MIN_IDLE_CONNS: "2"
      ADMIN_EMAIL: s44-admin@example.invalid
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_EXPIRE_HOUR: "1"
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?required}
      TZ: UTC
      SETUP_MIGRATION_TIMEOUT_SECONDS: "300"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  postgres:
    image: ${POSTGRES_IMAGE_ID:?required}
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    shm_size: 64m
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: s44
      POSTGRES_DB: s44_validation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["pg-data:/var/lib/postgresql"]
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s44 -d s44_validation"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: ${REDIS_IMAGE_ID:?required}
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    security_opt: ["no-new-privileges:true"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  app-data: {}
  pg-data: {}
  redis-data: {}
networks:
  default:
    internal: true
  ingress: {}
