name: Release

on:
  push:
    tags:
      - 'v*-klno.*-tps.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (or a branch/ref for dry run)'
        required: true
        type: string
      source_sha:
        description: '预期应用完整 SHA，必须与实际 checkout 一致'
        required: true
        type: string
      ci_run_id:
        description: '正式发布所绑定的成功 Personal CI run ID'
        required: false
        type: string
      simple_release:
        description: 'Simple release: only x86_64 GHCR image, skip other artifacts'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build and verify all selected artifacts without publishing'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  SIMPLE_RELEASE: ${{ inputs.simple_release == true || github.event_name == 'push' || vars.SIMPLE_RELEASE == 'true' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

jobs:
  prepare:
    if: github.repository == 'ccisnoxx/sub2api'
    permissions:
      contents: read
      actions: read
      checks: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
      sha: ${{ steps.plan.outputs.sha }}
      owner_lower: ${{ steps.plan.outputs.owner_lower }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      date: ${{ steps.plan.outputs.date }}
      ci_run_id: ${{ steps.guard.outputs.ci_run_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
      simple: ${{ steps.plan.outputs.simple }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
    steps:
      - name: Checkout workflow tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.DRY_RUN == 'true' && github.sha || 'main' }}
          persist-credentials: false
      - name: Preserve tooling for releases of older tags
        run: |
          cp -R .github/release-tools "$RUNNER_TEMP/release-tools"
          cp -R .github/personal-sync "$RUNNER_TEMP/personal-sync"
      - name: Preserve trusted publication guard
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release-guard"
          cp -R .github/release-tools "$RUNNER_TEMP/release-guard/release-tools"
          cp -R .github/personal-sync "$RUNNER_TEMP/release-guard/personal-sync"
          git rev-parse HEAD > "$RUNNER_TEMP/release-guard/control-sha"
      - name: Checkout selected application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind requested source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ $(git rev-parse HEAD) == "$SOURCE_SHA" ]] || { echo '实际源码 SHA 与请求不一致'; exit 1; }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Authorize personal publication
        id: guard
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          [[ "$SIMPLE_RELEASE" == true ]] || { echo '个人发布必须选择 simple_release'; exit 1; }
          python3 "$RUNNER_TEMP/release-guard/release-tools/personal_release.py" authorize --sha "$SOURCE_SHA" --tag "$RELEASE_TAG" --ci-run-id "$CI_RUN_ID"
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Resolve one source commit and target matrix
        id: plan
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          args=(--ref "$REQUESTED_REF")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" plan "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-sync-tooling
          path: ${{ runner.temp }}/personal-sync/
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.DRY_RUN != 'true'
        with:
          name: release-guard
          path: ${{ runner.temp }}/release-guard/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-file
          path: backend/cmd/server/VERSION
          retention-days: 1

  build-frontend:
    if: needs.prepare.outputs.skip != 'true'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20.20.2'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify frontend tool versions
        run: |
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - name: Record frontend build tool versions
        run: python "$RUNNER_TEMP/release-tools/toolchain.py" --tools python node pnpm --output frontend-toolchain.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-frontend
          path: frontend-toolchain.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  build-binaries:
    needs: [prepare, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_DATE: ${{ needs.prepare.outputs.date }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-file
          path: backend/cmd/server/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Verify Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' backend/go.mod)
          go version
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - name: Restore target-specific Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ needs.prepare.outputs.sha }}
          restore-keys: |
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.goos }}-${{ matrix.goarch }}-
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - name: Select one GoReleaser target
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" config build --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output "$RUNNER_TEMP/goreleaser.matrix.yaml"
      - name: Install pinned binary build tool
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '2.18.3'
          install-only: true
      - name: Build and archive without publishing
        run: goreleaser release --snapshot --clean --skip=validate,publish,docker,announce --config="$RUNNER_TEMP/goreleaser.matrix.yaml"
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: ''
      - name: Record binary build tool versions
        run: python "$RUNNER_TEMP/release-tools/toolchain.py" --tools python pyyaml go goreleaser --output binary-toolchain.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: binary-toolchain.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify and collect the target archive
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python "$RUNNER_TEMP/release-tools/release_matrix.py" collect --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --output matrix-output
      - name: Install verified SBOM generator
        run: |
          python "$RUNNER_TEMP/release-tools/supply_chain.py" install --tools syft --output "$RUNNER_TEMP/supply-chain-bin"
          echo "$RUNNER_TEMP/supply-chain-bin" >> "$GITHUB_PATH"
      - name: Generate binary SBOM and source provenance
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python "$RUNNER_TEMP/release-tools/supply_chain.py" binary --input matrix-output --output binary-evidence \
            --sha "$RELEASE_SHA" --version "$RELEASE_VERSION" --goos "$TARGET_OS" --goarch "$TARGET_ARCH" --toolchain binary-toolchain.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: binary-evidence/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: matrix-output/
          if-no-files-found: error
          retention-days: 1
      - name: Save updated target cache
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  release:
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      checks: read
    env:
      SIMPLE_RELEASE: ${{ needs.prepare.outputs.simple }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_DATE: ${{ needs.prepare.outputs.date }}
      CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tools/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: personal-sync-tooling
          path: ${{ runner.temp }}/personal-sync/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binary-*
          path: release-input
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-evidence-binary-*
          path: release-evidence/binaries
          merge-multiple: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/release-tools/requirements-release.txt"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.DRY_RUN != 'true'
        with:
          name: release-guard
          path: ${{ runner.temp }}/release-guard/
      - name: Verify transported control tooling imports
        if: env.DRY_RUN != 'true'
        run: |
          cat "$RUNNER_TEMP/release-guard/control-sha"
          python "$RUNNER_TEMP/release-guard/release-tools/personal_release.py" --help
      - name: Verify binary SBOM and provenance matrix
        run: |
          args=(--input release-input --evidence release-evidence/binaries --sha "$RELEASE_SHA" --version "$RELEASE_VERSION")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/supply_chain.py" verify-binaries "${args[@]}"
      - name: Install verified OCI transport tool
        run: |
          python "$RUNNER_TEMP/release-tools/supply_chain.py" install --tools oras --output "$RUNNER_TEMP/supply-chain-bin"
          echo "$RUNNER_TEMP/supply-chain-bin" >> "$GITHUB_PATH"
      - name: Verify complete matrix and prepare Docker contexts
        run: |
          args=(--version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --input release-input --output .release-context)
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" contexts "${args[@]}"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Install pinned publication tool
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '2.18.3'
          install-only: true
      - name: Record publication tool versions
        run: |
          docker version
          docker buildx inspect --bootstrap
          python "$RUNNER_TEMP/release-tools/toolchain.py" --tools python pyyaml go goreleaser buildx --output publication-toolchain.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain-publication
          path: publication-toolchain.json
          if-no-files-found: error
          retention-days: 90
      - name: Login to DockerHub
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        if: ${{ env.DRY_RUN != 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck final source, CI and version occupancy before publishing
        id: publication_guard
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-guard/release-tools/personal_release.py" authorize --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --ci-run-id "$CI_RUN_ID"
      - name: Build images and publish manifests
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
          REUSE_IMAGE: ${{ steps.publication_guard.outputs.reuse_image }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/release-tools/release-images.sh"
      - name: Verify published OCI revision, version and platform
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-guard/release-tools/personal_release.py" verify-image --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" > publication.json
      - name: Save publication evidence
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: personal-publication
          path: publication.json
          if-no-files-found: error
          retention-days: 90
      - name: Finalize immutable supply chain verification materials
        run: |
          args=(--input release-evidence --sha "$RELEASE_SHA" --version "$RELEASE_VERSION")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/supply_chain.py" finalize "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve dry-run OCI images with attestations
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sub2api-*.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Get annotated tag notes
        id: tag_message
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents:body)' "$RELEASE_TAG")
          if [[ "$DRY_RUN" != true ]]; then
            TAG_MESSAGE+=$'\n\n个人发布来源与镜像：\n'
            TAG_MESSAGE+=$(cat publication.json)
            TAG_MESSAGE+=$'\n'
            TAG_MESSAGE+="CI run: $CI_RUN_ID; Release run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          TAG_MESSAGE+=$'\n\n本次完整构建证明与 SBOM：\n'
          TAG_MESSAGE+="材料前缀：run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          TAG_MESSAGE+=$'\n'

          TAG_MESSAGE+=$(cat release-evidence/summary/*.release-summary.json)
          DELIMITER="TAG_MESSAGE_$(openssl rand -hex 16)"
          {
            echo "message<<$DELIMITER"
            echo "$TAG_MESSAGE"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare publication-only GoReleaser config
        run: |
          args=(publish --output "$RUNNER_TEMP/goreleaser.publisher.yaml")
          if [[ "$SIMPLE_RELEASE" == true ]]; then args+=(--simple); fi
          python "$RUNNER_TEMP/release-tools/release_matrix.py" config "${args[@]}"
      - name: Recheck final source, CI and tag before Release publication
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$RUNNER_TEMP/release-guard/release-tools/personal_release.py" authorize --sha "$RELEASE_SHA" --tag "$RELEASE_TAG" --ci-run-id "$CI_RUN_ID" > "$RUNNER_TEMP/final-publication-guard.json"
          python3 - "$RUNNER_TEMP/final-publication-guard.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          summaries = list(Path('release-evidence/summary').glob('*.release-summary.json'))
          if len(summaries) != 1:
              raise SystemExit('正式发布必须有唯一的已验证镜像摘要')
          images = json.loads(summaries[0].read_text())['images']
          if len(images) != 1:
              raise SystemExit('个人发布必须有唯一的已验证镜像')
          expected = images[0]['digest']
          publication = json.loads(Path('publication.json').read_text())['digest']
          current = json.loads(Path(sys.argv[1]).read_text())['digest']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', expected) or current != expected or publication != expected:
              raise SystemExit('镜像版本占用与已验证 digest 不一致，禁止发布 Release')
          PY
      - name: Publish existing archives and release notes
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '2.18.3'
          args: release --clean --skip=validate,before,docker ${{ env.DRY_RUN == 'true' && '--snapshot --skip=publish,announce' || '' }} --config=${{ runner.temp }}/goreleaser.publisher.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REPO_OWNER_LOWER: ${{ needs.prepare.outputs.owner_lower }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}
      - name: Upload dry-run checksums and metadata
        if: ${{ env.DRY_RUN == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-report
          path: |
            dist/checksums.txt
            dist/artifacts.json
            dist/metadata.json
            publication-toolchain.json
          if-no-files-found: error
          retention-days: 3

      # Update DockerHub description
      - name: Update DockerHub description
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sub2api
          short-description: "Sub2API - AI API Gateway Platform"
          readme-filepath: ./deploy/DOCKER.md

      # Send Telegram notification
      - name: Send Telegram Notification
        if: ${{ env.DRY_RUN != 'true' && env.SIMPLE_RELEASE != 'true' }}
        env:
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        continue-on-error: true
        run: |
          # 检查必要的环境变量
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram credentials not configured, skipping notification"
            exit 0
          fi

          TAG_NAME="$RELEASE_TAG"
          VERSION=${TAG_NAME#v}
          REPO="${{ github.repository }}"
          GHCR_IMAGE="ghcr.io/${REPO,,}"  # ${,,} converts to lowercase

          # 获取 tag message 内容并转义 Markdown 特殊字符
          TAG_MESSAGE=$(echo "$TAG_MESSAGE" | sed 's/\([_*`\[]\)/\\\1/g')

          # 限制消息长度（Telegram 消息限制 4096 字符，预留空间给头尾固定内容）
          if [ ${#TAG_MESSAGE} -gt 3500 ]; then
            TAG_MESSAGE="${TAG_MESSAGE:0:3500}..."
          fi

          # 构建消息内容
          MESSAGE="🚀 *Sub2API 新版本发布！*"$'\n'$'\n'
          MESSAGE+="📦 版本号: \`${VERSION}\`"$'\n'$'\n'

          # 添加更新内容
          if [ -n "$TAG_MESSAGE" ]; then
            MESSAGE+="${TAG_MESSAGE}"$'\n'$'\n'
          fi

          MESSAGE+="🐳 *Docker 部署:*"$'\n'
          MESSAGE+="\`\`\`bash"$'\n'
          # 根据是否配置 DockerHub 动态生成
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            DOCKER_IMAGE="${DOCKERHUB_USERNAME}/sub2api"
            MESSAGE+="# Docker Hub"$'\n'
            MESSAGE+="docker pull ${DOCKER_IMAGE}:${VERSION}"$'\n'
            MESSAGE+="# GitHub Container Registry"$'\n'
          fi
          MESSAGE+="docker pull ${GHCR_IMAGE}:${VERSION}"$'\n'
          MESSAGE+="\`\`\`"$'\n'$'\n'
          MESSAGE+="🔗 *相关链接:*"$'\n'
          MESSAGE+="• [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG_NAME})"$'\n'
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            MESSAGE+="• [Docker Hub](https://hub.docker.com/r/${DOCKER_IMAGE})"$'\n'
          fi
          MESSAGE+="• [GitHub Packages](https://github.com/${REPO}/pkgs/container/sub2api)"$'\n'$'\n'
          MESSAGE+="#Sub2API #Release #${TAG_NAME//./_}"

          # 发送消息
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "${TELEGRAM_CHAT_ID}" \
              --arg text "${MESSAGE}" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "Markdown",
                disable_web_page_preview: true
              }')"

  sync-version-file:
    needs: [prepare, release]
    if: ${{ needs.release.result == 'success' && needs.prepare.outputs.dry_run != 'true' && github.repository != 'ccisnoxx/sub2api' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        run: |
          VERSION="$RELEASE_VERSION"

          CURRENT_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION || true)
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "VERSION file already matches $VERSION"
            exit 0
          fi

          echo "$VERSION" > backend/cmd/server/VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
