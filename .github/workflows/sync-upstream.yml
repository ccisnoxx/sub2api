name: Sync KlN into personal

# 每日定义先保持仓库变量门禁关闭；实际 CI/保护验收后才设为 true。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'KlN vX.Y.Z-klno.N 或完整 SHA；留空选择最新发布标签'
        type: string
        required: false
      verify_ci:
        description: '仅演练机器人 PR 和 CI，不升级上游；生成明确标记的草稿 PR'
        type: boolean
        default: false

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.repository == 'ccisnoxx/sub2api' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'schedule' || vars.PERSONAL_SYNC_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare merge candidate and dispatch checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_TARGET: ${{ inputs.target }}
          VERIFY_CI: ${{ inputs.verify_ci || false }}
        run: python3 .github/personal-sync/sync.py
