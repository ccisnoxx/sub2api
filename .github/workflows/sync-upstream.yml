name: Sync KlN into personal

# 每日候选准备由维护者按需开启；仅提供 Quick 反馈，不自动发布。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'KlN vX.Y.Z-klno.N 或完整 SHA；留空选择最新发布标签'
        type: string
        required: false
      verify_ci:
        description: '仅演练机器人 PR 和 CI，不升级上游；生成明确标记的草稿 PR'
        type: boolean
        default: false

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: >-
      github.repository == 'ccisnoxx/sub2api' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'schedule' || vars.PERSONAL_SYNC_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # sync.py 使用普通 git push 发布候选；唯一需要持久 Git 凭据的 job。
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Prepare merge candidate and dispatch checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_TARGET: ${{ inputs.target }}
          VERIFY_CI: ${{ inputs.verify_ci || false }}
        run: python3 .github/personal-sync/sync.py
