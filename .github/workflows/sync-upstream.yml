name: Upstream sync paused

# P0 安全占位：P2 验证完成前，仅允许手动查看暂停说明。
# main 与 personal 必须维护同一定义；不拉取、改写分支、打标签或触发发布。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain paused synchronization
        run: |
          printf '%s\n' '上游同步已暂停。完成 personal 同步 PR 与候选 CI 验证后，再启用 P2 安全流程。'
