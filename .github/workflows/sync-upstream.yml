name: Sync KlN into personal

# 独立复核和实际 CI 演练完成后再添加每日 schedule。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'KlN vX.Y.Z-klno.N 或完整 SHA；留空选择最新发布标签'
        type: string
        required: false
      verify_ci:
        description: '仅演练机器人 PR 和 CI，不升级上游；生成明确标记的草稿 PR'
        type: boolean
        default: false

concurrency:
  group: personal-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'ccisnoxx/sub2api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare merge candidate and dispatch checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_TARGET: ${{ inputs.target }}
          VERIFY_CI: ${{ inputs.verify_ci || false }}
        run: python3 .github/personal-sync/sync.py
