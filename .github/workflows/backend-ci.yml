name: CI

on:
  push:
    # personal 的完整检查由 Personal CI 调用，避免机器人 push 触发问题。
    branches-ignore:
      - main
      - personal
      - 'codex/sync-klno-*'
      - 'codex/verify-personal-ci-*'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches-ignore:
      - personal
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

# 同一分支连续推送时取消还在跑的上一轮，只留最新的那次。
concurrency:
  group: backend-ci-${{ github.ref }}-${{ inputs.source_sha && github.run_id || 'event' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' backend/go.mod)
          go version
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Unit tests
        working-directory: backend
        run: |
          python3 ../tools/test_backend_unit_runner_test.py
          make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: OpenAI recording concurrency checks
        working-directory: backend
        env:
          RECORDING_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          # Personal CI 的固定候选必须执行；普通 PR 只检查实际包含的功能。
          if [ -n "$RECORDING_SOURCE_SHA" ] || [ -d internal/pkg/upstreamrecord ]; then
            go test -race -tags=unit -timeout=60s -run '^Test(Recorder|OpenAIRecording)' ./internal/pkg/upstreamrecord ./internal/service
          else
            echo '当前源码未包含 OpenAI recording 模块，此定向检查不适用。'
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20.20.2'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify frontend tool versions
        run: |
          node --version
          pnpm --version
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' backend/go.mod)
          go version
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_*.py'
      - run: bash -n .github/release-tools/release-images.sh
