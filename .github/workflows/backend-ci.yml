name: CI

on:
  # 候选只通过 Personal CI 调用，避免分支 push 与 PR 双重执行。
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      run_backend:
        type: boolean
        default: true
      run_frontend:
        type: boolean
        default: true
      run_shell:
        type: boolean
        default: true
      run_release_helpers:
        type: boolean
        default: true

# 同一分支连续推送时取消还在跑的上一轮，只留最新的那次。
concurrency:
  group: backend-ci-${{ github.ref }}-${{ inputs.source_sha && github.run_id || 'event' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    if: inputs.run_shell
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh
          /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh

  unit:
    if: inputs.run_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' backend/go.mod)
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - name: Unit tests
        working-directory: backend
        run: |
          python3 ../tools/test_backend_unit_runner_test.py
          make test-unit

  integration:
    if: inputs.run_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' backend/go.mod)
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  recording-race:
    if: inputs.run_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' backend/go.mod)
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - name: OpenAI recording concurrency checks
        working-directory: backend
        run: go test -race -tags=unit -timeout=60s -run '^Test(Recorder|OpenAIRecording)' ./internal/pkg/upstreamrecord ./internal/service

  frontend:
    if: inputs.run_frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, critical contracts and build
        run: |
          pnpm --dir frontend run lint:check
          make test-frontend-critical
          pnpm --dir frontend run build

  golangci-lint:
    if: inputs.run_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' backend/go.mod)
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    if: inputs.run_release_helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_*.py'
      - run: bash -n .github/release-tools/release-images.sh
      - name: Personal deployment contracts
        run: |
          if [[ -d deploy/personal ]]; then
            git fetch --no-tags https://github.com/KlN-4096/sub2api.git \
              refs/tags/v0.2.14-klno.3:refs/tags/v0.2.14-klno.3 \
              refs/tags/v0.2.14-klno.5:refs/tags/v0.2.14-klno.5
            bash -n deploy/personal/deploy-hostdzire.sh
            python -m unittest discover -s deploy/personal -p 'test_*.py'
          fi
