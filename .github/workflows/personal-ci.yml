name: Personal CI
run-name: Personal CI | ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }} | base ${{ inputs.base_sha || github.event.pull_request.base.sha || github.sha }}

on:
  pull_request:
    branches: [personal]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [personal]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: '被检查的完整 SHA，必须等于 dispatch ref 的 SHA'
        type: string
        required: true
      base_sha:
        description: '当前 personal 完整 SHA'
        type: string
        required: true
      pr_number:
        description: '候选 PR 编号；检查 personal 自身时留空'
        type: string
        required: false

concurrency:
  # 原生 PR 和机器人 dispatch 使用同一分支锁，避免同候选并行全量检查。
  group: personal-ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.sha }}
  PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

jobs:
  binding:
    # 草稿期间本地定向收敛；显式 dispatch 仍可验收稳定的草稿候选。
    if: github.repository == 'ccisnoxx/sub2api' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.sha.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate and latest personal
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/personal-sync/check_binding.py
          printf 'source_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

  changes:
    needs: binding
    runs-on: ubuntu-latest
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
      frontend_changed: ${{ steps.plan.outputs.frontend_changed }}
      backend_changed: ${{ steps.plan.outputs.backend_changed }}
      dependencies_changed: ${{ steps.plan.outputs.dependencies_changed }}
      deploy_changed: ${{ steps.plan.outputs.deploy_changed }}
      release_tools_changed: ${{ steps.plan.outputs.release_tools_changed }}
      wide_merge_changed: ${{ steps.plan.outputs.wide_merge_changed }}
      run_backend: ${{ steps.plan.outputs.run_backend }}
      run_frontend: ${{ steps.plan.outputs.run_frontend }}
      run_shell: ${{ steps.plan.outputs.run_shell }}
      run_release_helpers: ${{ steps.plan.outputs.run_release_helpers }}
      run_tps: ${{ steps.plan.outputs.run_tps }}
      run_sync_contracts: ${{ steps.plan.outputs.run_sync_contracts }}
      run_backend_security: ${{ steps.plan.outputs.run_backend_security }}
      run_frontend_security: ${{ steps.plan.outputs.run_frontend_security }}
      reused: ${{ steps.plan.outputs.reused }}
      reuse_run_id: ${{ steps.plan.outputs.reuse_run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.binding.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select changed contracts or verify candidate evidence
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/personal-sync/ci_policy.py plan

  existing-ci:
    needs: [binding, changes]
    if: needs.changes.outputs.run_backend == 'true' || needs.changes.outputs.run_frontend == 'true' || needs.changes.outputs.run_shell == 'true' || needs.changes.outputs.run_release_helpers == 'true'
    uses: ./.github/workflows/backend-ci.yml
    with:
      source_sha: ${{ needs.binding.outputs.source_sha }}
      run_backend: ${{ needs.changes.outputs.run_backend == 'true' }}
      run_frontend: ${{ needs.changes.outputs.run_frontend == 'true' }}
      run_shell: ${{ needs.changes.outputs.run_shell == 'true' }}
      run_release_helpers: ${{ needs.changes.outputs.run_release_helpers == 'true' }}

  existing-security:
    needs: [binding, changes]
    if: needs.changes.outputs.run_backend_security == 'true' || needs.changes.outputs.run_frontend_security == 'true'
    uses: ./.github/workflows/security-scan.yml
    with:
      source_sha: ${{ needs.binding.outputs.source_sha }}
      backend_scan: ${{ needs.changes.outputs.run_backend_security == 'true' }}
      frontend_scan: ${{ needs.changes.outputs.run_frontend_security == 'true' }}

  tps:
    needs: [binding, changes]
    if: needs.changes.outputs.run_tps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.binding.outputs.source_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: TPS contracts
        run: |
          pnpm --dir frontend exec vitest run src/components/admin/usage/__tests__/UsageTps.spec.ts src/components/admin/usage/__tests__/UsageTable.spec.ts src/components/common/__tests__/HelpTooltip.spec.ts

  sync-contracts:
    needs: [binding, changes]
    if: needs.changes.outputs.run_sync_contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.binding.outputs.source_sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/personal-sync -p 'test_*.py'

  personal-ready:
    name: personal-ready
    if: always() && github.repository == 'ccisnoxx/sub2api' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [binding, changes, existing-ci, existing-security, tps, sync-contracts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck candidate and current base after CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/personal-sync/check_binding.py
      - name: Verify selected results and bind evidence to this run
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          PLAN_JSON: ${{ needs.changes.outputs.plan_json }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 .github/personal-sync/ci_policy.py attest
      - uses: actions/upload-artifact@v7
        with:
          name: personal-ci-evidence
          path: ci-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
