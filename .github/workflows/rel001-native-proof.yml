name: REL-001 native amd64 proof
run-name: REL-001 native | 036ade78ee5732d0dc860c3293aa70807ec1ddf1 | OCI 1d902657

on:
  push:
    branches: [codex/rel-001-native-proof]

permissions:
  contents: read
  actions: read

concurrency:
  group: rel001-native-proof
  cancel-in-progress: false

jobs:
  native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 036ade78ee5732d0dc860c3293aa70807ec1ddf1
          path: application
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Recheck immutable source run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/rel001-native/proof.py source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '11724260850'
          run-id: '38196678157'
          repository: ccisnoxx/sub2api
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rel001-oci
          merge-multiple: true
      - name: Enable OCI-capable storage on this disposable runner
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          data = json.loads(path.read_text()) if path.exists() else {}
          data.setdefault('features', {})['containerd-snapshotter'] = True
          path.write_text(json.dumps(data) + '\n')
          PY
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}'
      - name: Native startup and complete five-round gateway comparison
        env:
          OCI_DIRECTORY: ${{ runner.temp }}/rel001-oci
          PROOF_DIRECTORY: ${{ runner.temp }}/rel001-proof
        run: python3 .github/rel001-native/proof.py run
      - name: Save sanitized evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel001-native-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rel001-proof/gateway-performance.json
            ${{ runner.temp }}/rel001-proof/native-proof.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
