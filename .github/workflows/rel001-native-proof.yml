name: REL-001 native amd64 proof
run-name: REL-001 native | 3ded82bcde22dad28ff6c08939369c44d57ff0b1 | OCI 9397e21c

on:
  push:
    branches: [codex/rel-001-native-proof]

permissions:
  contents: read
  actions: read

concurrency:
  group: rel001-native-proof
  cancel-in-progress: false

jobs:
  native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 3ded82bcde22dad28ff6c08939369c44d57ff0b1
          path: application
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Recheck immutable source run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/rel001-native/proof.py source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '11729451134'
          run-id: '38210844700'
          repository: ccisnoxx/sub2api
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/rel001-oci
          merge-multiple: true
      - name: Enable OCI-capable storage on this disposable runner
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          data = json.loads(path.read_text()) if path.exists() else {}
          data.setdefault('features', {})['containerd-snapshotter'] = True
          path.write_text(json.dumps(data) + '\n')
          PY
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: application/backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: application/backend/go.sum
      - name: Verify exact Go version
        run: |
          expected_go=$(awk '$1 == "go" {print $2; exit}' application/backend/go.mod)
          [[ $(go env GOVERSION) == "go${expected_go}" ]]
      - name: Native five-round gateway comparison and synthetic database upgrade
        env:
          OCI_DIRECTORY: ${{ runner.temp }}/rel001-oci
          PROOF_DIRECTORY: ${{ runner.temp }}/rel001-proof
        run: python3 .github/rel001-native/proof.py run
      - name: Save sanitized evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel001-native-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rel001-proof/gateway-performance.json
            ${{ runner.temp }}/rel001-proof/native-proof.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
