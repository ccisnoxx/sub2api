name: Personal release
run-name: Personal release | ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: '当前 personal 的完整源码 SHA'
        required: true
        type: string
      ci_run_id:
        description: '最终 personal 或其已合并同树候选的成功手动 Full CI；留空自动查找'
        required: false
        type: string

concurrency:
  group: personal-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'ccisnoxx/sub2api' &&
      github.ref == 'refs/heads/main' &&
      vars.PERSONAL_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Preserve trusted control tooling
        run: |
          cp -R .github/release-tools "$RUNNER_TEMP/release-tools"
          cp -R .github/personal-sync "$RUNNER_TEMP/personal-sync"
      - name: Checkout trusted personal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: personal
          fetch-depth: 0
          persist-credentials: false
      - name: Gate final SHA, allocate version and explicitly dispatch Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python3 "$RUNNER_TEMP/release-tools/personal_release.py" prepare --sha "$SOURCE_SHA" --ci-run-id "$CI_RUN_ID"
